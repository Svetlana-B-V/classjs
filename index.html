<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Королевство JavaScript 2.0 — Интерактивный учебник и лаборатория</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6ecd5;
    --bg-accent: #efe0be;
    --card: #fffaf0;
    --ink: #2e2010;
    --mute: #786246;
    --gold: #d98a16;
    --gold-light: #fef3c7;
    --acc: #248252;
    --acc-light: #d1fae5;
    --bad: #c93b2b;
    --bad-light: #fee2e2;
    --code: #1e1b2e;
    --codeink: #f4eeff;
    --line: #dec89a;
    --shadow: 0 10px 25px -5px rgba(80, 50, 15, 0.12);
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #13111c;
    --bg-accent: #1d192b;
    --card: #211d33;
    --ink: #f5eedc;
    --mute: #a89ec4;
    --gold: #f5b041;
    --gold-light: #3a2e18;
    --acc: #34d399;
    --acc-light: #13392c;
    --bad: #f87171;
    --bad-light: #3c1c21;
    --code: #0d0b14;
    --codeink: #f4eeff;
    --line: #393256;
    --shadow: 0 10px 28px -5px rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(circle at top right, var(--bg-accent), var(--bg));
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    line-height: 1.55;
    min-height: 100vh;
    transition: background 0.3s ease, color 0.3s ease;
  }

  h1, h2, h3, .font-title {
    font-family: 'Comfortaa', cursive, sans-serif;
  }

  code, pre, textarea.code-editor {
    font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace;
  }

  .k-card {
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 18px;
    padding: 18px;
    box-shadow: var(--shadow);
    transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .k-loc {
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .k-loc:hover {
    transform: translateY(-4px);
    border-color: var(--gold);
  }
  .k-loc.done {
    border-color: var(--acc);
  }

  .k-btn {
    font-family: inherit;
    cursor: pointer;
    border: 2px solid var(--gold);
    background: linear-gradient(180deg, #f7b749 0%, var(--gold) 100%);
    color: #261704;
    border-radius: 12px;
    padding: 9px 16px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: transform 0.12s ease, filter 0.15s ease, opacity 0.15s;
    box-shadow: 0 3px 0 rgba(0,0,0,0.18);
  }
  .k-btn:hover:not(:disabled) {
    filter: brightness(1.06);
    transform: translateY(-1px);
  }
  .k-btn:active:not(:disabled) {
    transform: translateY(1px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.18);
  }
  .k-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .k-btn.ghost {
    background: transparent;
    color: var(--ink);
    border-color: var(--line);
    box-shadow: none;
  }
  .k-btn.ghost:hover:not(:disabled) {
    border-color: var(--gold);
    background: rgba(217, 138, 22, 0.1);
  }
  .k-btn.green {
    border-color: var(--acc);
    background: linear-gradient(180deg, #34d399 0%, #10b981 100%);
    color: #06281e;
  }

  .nav-tab {
    padding: 8px 13px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 0.88rem;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.2s ease;
    background: rgba(120, 98, 70, 0.08);
    color: var(--ink);
    white-space: nowrap;
  }
  .nav-tab:hover {
    border-color: var(--gold);
  }
  .nav-tab.active {
    background: var(--gold);
    color: #241604;
    font-weight: 700;
    box-shadow: 0 4px 12px rgba(217, 138, 22, 0.3);
  }

  textarea.code-editor {
    width: 100%;
    min-height: 195px;
    background: var(--code);
    color: var(--codeink);
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    font-size: 14px;
    line-height: 1.55;
    resize: vertical;
    outline: none;
  }
  textarea.code-editor:focus {
    border-color: var(--gold);
  }

  pre.out-console {
    background: var(--code);
    color: #6ee7b7;
    border-radius: 14px;
    padding: 14px;
    min-height: 64px;
    max-height: 240px;
    margin: 8px 0;
    font-size: 13.5px;
    white-space: pre-wrap;
    overflow-y: auto;
    border: 2px solid rgba(255,255,255,0.08);
  }

  .stage-box {
    background: #ffffff;
    color: #1e293b;
    border: 2px dashed var(--gold);
    border-radius: 14px;
    padding: 16px;
    min-height: 140px;
    transition: all 0.2s;
  }

  .tree-box {
    background: var(--code);
    color: var(--codeink);
    border-radius: 14px;
    padding: 12px;
    font-size: 13px;
    line-height: 1.65;
    overflow-x: auto;
    min-height: 140px;
  }

  .tg { color: #ffb86b; }
  .at { color: #8be9fd; }
  .tx { color: #e2d9f3; }

  /* Mascot float animation */
  @keyframes floatSlow {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-5px); }
  }
  .mascot-avatar {
    animation: floatSlow 3s ease-in-out infinite;
  }

  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.96) translateY(6px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  .animate-pop {
    animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  /* Particle coins */
  .coin-particle {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    font-size: 1.5rem;
    animation: coinFly 1s cubic-bezier(0.2, 0.8, 0.4, 1) forwards;
  }
  @keyframes coinFly {
    0% { opacity: 1; transform: translate(0, 0) scale(0.7) rotate(0deg); }
    100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.3) rotate(360deg); }
  }

  /* Figma Inspector guide lines */
  .fig-el {
    position: relative;
    cursor: pointer;
    transition: outline 0.15s ease;
  }
  .fig-el:hover {
    outline: 2px dashed #0d99ff;
  }
  .fig-el.selected {
    outline: 2px solid #f24e1e !important;
  }
  .fig-badge-size {
    position: absolute;
    bottom: -20px;
    left: 50%;
    transform: translateX(-50%);
    background: #f24e1e;
    color: #fff;
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    padding: 1px 5px;
    border-radius: 4px;
    white-space: nowrap;
    pointer-events: none;
    z-index: 20;
    display: none;
  }
  .fig-el.selected .fig-badge-size {
    display: block;
  }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    background: var(--acc);
    color: #fff;
    padding: 12px 22px;
    border-radius: 999px;
    display: none;
    z-index: 9000;
    font-weight: 700;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>

<div class="max-w-6xl mx-auto px-3 sm:px-5 py-4">
  <!-- HEADER -->
  <header class="k-card mb-4 flex flex-col gap-3">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="text-4xl select-none mascot-avatar" id="header-crest">🏰</div>
        <div>
          <h1 class="text-xl sm:text-2xl font-bold tracking-tight">Королевство JavaScript <span class="text-sm px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-600 dark:text-amber-300 align-middle">2.0</span></h1>
          <p class="text-xs sm:text-sm" style="color:var(--mute)">Интерактивная школа кода, Git, Node.js и Figma</p>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2 sm:gap-3">
        <div id="stats-badge" class="px-3.5 py-1.5 rounded-xl font-bold text-sm border-2" style="border-color:var(--gold); background:var(--gold-light); color:var(--ink)">
          ⭐ 0/7 · 🪙 0
        </div>
        <button class="k-btn ghost text-xs sm:text-sm !py-1.5 !px-3" onclick="toggleTheme()" id="theme-btn" title="Переключить тему">
          🌙 Тема
        </button>
        <button class="k-btn ghost text-xs sm:text-sm !py-1.5 !px-3" onclick="showResetBox()" title="Сбросить прогресс">
          🗑️ Сброс
        </button>
      </div>
    </div>

    <!-- Overall Kingdom Progress Bar -->
    <div class="w-full bg-black/10 dark:bg-white/10 h-2.5 rounded-full overflow-hidden">
      <div id="kingdom-progress-bar" class="h-full transition-all duration-500" style="width: 0%; background: linear-gradient(90deg, var(--gold), var(--acc));"></div>
    </div>

    <!-- Reset confirmation inline bar (No confirm() used!) -->
    <div id="reset-confirm-bar" class="hidden p-3 rounded-xl border-2 flex flex-wrap items-center justify-between gap-2 text-sm" style="border-color:var(--bad); background:var(--bad-light)">
      <span>⚠️ <b>Точно сбросить весь прогресс, монеты и достижения?</b></span>
      <div class="flex gap-2">
        <button class="k-btn !py-1 !px-3 text-xs" style="background:var(--bad); border-color:var(--bad); color:#fff" onclick="confirmResetProgress()">Да, обнулить</button>
        <button class="k-btn ghost !py-1 !px-3 text-xs" onclick="hideResetBox()">Отмена</button>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <nav class="flex items-center gap-1.5 overflow-x-auto pb-1 pt-1" id="main-nav">
      <button class="nav-tab active" data-tab="map" onclick="switchTab('map')">🗺️ Карта JS (7 земель)</button>
      <button class="nav-tab" data-tab="workshop" onclick="switchTab('workshop')">🛠️ Мастерская (Модуль)</button>
      <button class="nav-tab" data-tab="git" onclick="switchTab('git')">🐙 Кузница Git и GitHub</button>
      <button class="nav-tab" data-tab="node" onclick="switchTab('node')">🟢 Мельница Node.js</button>
      <button class="nav-tab" data-tab="figma" onclick="switchTab('figma')">🎨 Гильдия Figma (.fig)</button>
      <button class="nav-tab" data-tab="test" onclick="switchTab('test')">🏆 Храм Испытаний</button>
    </nav>
  </header>

  <!-- MASCOT HELPER BANNER -->
  <div class="k-card mb-4 !py-3 !px-4 flex items-center gap-3 border-l-8" style="border-left-color: var(--gold);">
    <div class="text-3xl sm:text-4xl mascot-avatar select-none">🐱‍👓</div>
    <div class="flex-1 text-sm">
      <div class="font-bold text-amber-600 dark:text-amber-400">Кот-Компилятор Басик:</div>
      <div id="mascot-speech">Привет, искатель приключений! Выбирай локацию на Карте или загляни в Мастерскую, Кузницу Git, Мельницу Node.js и Гильдию Figma!</div>
    </div>
  </div>

  <!-- MAIN CONTENT CONTAINER -->
  <main id="app" class="animate-pop"></main>
</div>

<div id="toast"></div>

<script>
/* ==========================================================================
   СОСТОЯНИЕ КОРОЛЕВСТВА И СОХРАНЕНИЕ В LOCALSTORAGE
   ========================================================================== */
var STORAGE_KEY = 'kingdom_js_v2_state';
var state = {
  done: {},          // Пройденные базовые уроки JS (0..6)
  coins: 0,          // Золотые монеты
  best: 0,           // Лучший результат в тесте
  workshopSteps: {}, // Выполненные шаги практического модуля (1..4)
  gitSteps: {},      // Выполненные шаги тренажёра Git
  nodeStarted: false,// Запускал ли сервер Node.js
  figmaInspected: false, // Изучил ли макет .fig
  theme: 'light'
};

function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      state = Object.assign(state, parsed);
    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      state.theme = 'dark';
    }
  } catch (e) {}
  applyTheme();
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {}
  updateHeaderStats();
}

function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.theme);
  var btn = document.getElementById('theme-btn');
  if (btn) btn.innerHTML = state.theme === 'dark' ? '☀️ Светлая' : '🌙 Тёмная';
}

function toggleTheme() {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  applyTheme();
  saveState();
}

function showResetBox() {
  document.getElementById('reset-confirm-bar').classList.remove('hidden');
}
function hideResetBox() {
  document.getElementById('reset-confirm-bar').classList.add('hidden');
}
function confirmResetProgress() {
  state = {
    done: {},
    coins: 0,
    best: 0,
    workshopSteps: {},
    gitSteps: {},
    nodeStarted: false,
    figmaInspected: false,
    theme: state.theme
  };
  saveState();
  hideResetBox();
  toast('Прогресс сброшен! Начинаем новое приключение 🌟');
  switchTab('map');
}

function $(id) { return document.getElementById(id); }

function setMascot(text) {
  var el = $('mascot-speech');
  if (el) el.innerHTML = text;
}

function toast(text, isBad) {
  var e = $('toast');
  e.textContent = text;
  e.style.background = isBad ? 'var(--bad)' : 'var(--acc)';
  e.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function() {
    e.style.display = 'none';
  }, 2600);
}

/* Салют из золотых монеток при успехе */
function spawnCoinsEffect() {
  var emojis = ['🪙', '✨', '⭐', '💎'];
  for (var i = 0; i < 14; i++) {
    var span = document.createElement('span');
    span.className = 'coin-particle';
    span.textContent = emojis[i % emojis.length];
    span.style.left = (window.innerWidth / 2 + (Math.random() * 80 - 40)) + 'px';
    span.style.top = (window.innerHeight / 2 + (Math.random() * 40 - 20)) + 'px';
    var angle = Math.random() * Math.PI * 2;
    var dist = 90 + Math.random() * 160;
    span.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
    span.style.setProperty('--ty', (Math.sin(angle) * dist - 80) + 'px');
    document.body.appendChild(span);
    setTimeout(function(el) { el.remove(); }, 1000, span);
  }
}

function addCoins(amount, reason) {
  state.coins += amount;
  saveState();
  spawnCoinsEffect();
  toast('+' + amount + ' 🪙 ' + (reason || 'Награда получена!'));
}

function updateHeaderStats() {
  var nLessons = Object.keys(state.done).length;
  var nWorkshop = Object.keys(state.workshopSteps).length;
  var badge = $('stats-badge');
  if (badge) {
    badge.innerHTML = '⭐ Уроки: ' + nLessons + '/' + L.length + ' · 🛠️ ' + nWorkshop + '/4 · 🪙 ' + state.coins;
  }
  // Вычисляем общий прогресс королевства (7 уроков + 4 шага мастерской + Git + Node + Figma + Тест = 15 вех)
  var totalMilestones = L.length + 4 + 4;
  var achieved = nLessons + nWorkshop +
    (Object.keys(state.gitSteps).length >= 5 ? 1 : 0) +
    (state.nodeStarted ? 1 : 0) +
    (state.figmaInspected ? 1 : 0) +
    (state.best >= 7 ? 1 : 0);
  var pct = Math.min(100, Math.round((achieved / totalMilestones) * 100));
  var bar = $('kingdom-progress-bar');
  if (bar) bar.style.width = pct + '%';
}

/* Копирование в буфер обмена (безопасно для iFrame) */
function copyText(text, label) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    toast('📋 Скопировано: ' + (label || 'код'));
  } catch (e) {
    toast('Не удалось скопировать', true);
  }
  ta.remove();
}

/* ==========================================================================
   ДЕТСКИЙ ПЕРЕВОДЧИК ОШИБОК JAVASCRIPT
   ========================================================================== */
function translateJsError(err) {
  var msg = String(err && err.message ? err.message : err);
  if (/Unexpected token|Unexpected end of input/i.test(msg)) {
    return 'Кажется, пропущена закрывающая скобка <code>)</code>, фигурная скобка <code>}</code> или запятая. Проверь парность всех скобок!';
  }
  if (/Invalid or unexpected token|unterminated string/i.test(msg)) {
    return 'Проверь кавычки вокруг текста! Если открыл двойную кавычку <code>"</code>, закрыть нужно тоже двойной <code>"</code>.';
  }
  if (/is not defined/i.test(msg)) {
    var v = msg.split(' ')[0];
    return 'Переменная или команда <code>' + esc(v) + '</code> не найдена. Возможно, в её имени опечатка или ты забыл создать её через <code>let</code> / <code>const</code>, либо забыл взять текст в кавычки.';
  }
  if (/Assignment to constant variable/i.test(msg)) {
    return 'Ты попытался изменить переменную, созданную через <code>const</code> (запертый сундук). Используй <code>let</code>, если значение нужно менять!';
  }
  if (/Cannot set properties of null|Cannot read properties of null/i.test(msg)) {
    return 'Элемент на странице не найден (<code>querySelector</code> вернул <code>null</code>). Проверь, правильно ли написан тег, класс (с точкой) или <code>#id</code> (с решёткой)!';
  }
  if (/is not a function/i.test(msg)) {
    return 'Проверь регистр букв в названии команды! В JavaScript важны большие и маленькие буквы: например, <code>querySelector</code> или <code>addEventListener</code>.';
  }
  return 'Внимательно проверь последнюю изменённую строчку: все ли скобки, кавычки и точки на своих местах.';
}

/* ==========================================================================
   БАЗОВЫЕ 7 УРОКОВ JAVASCRIPT (ОТЛАЖЕННЫЕ + ВИЗУАЛИЗАЦИИ)
   ========================================================================== */
var BASE_STAGE_HTML = '<h2>Привет, мир!</h2><p class="txt">Я живу в DOM-дереве</p><button id="btn" class="px-4 py-2 rounded-lg font-bold bg-amber-500 text-slate-900 hover:bg-amber-400 transition">Нажми меня</button>';

var L = [
  {
    ico: '🌾',
    name: 'Долина Переменных',
    story: 'Ты — юный путешественник и ступил на землю JavaScript. Первый житель, Гном-Кладовщик, протягивает тебе волшебные коробки с ярлыками.',
    learn: '<b>Переменная</b> — это коробка с названием, в которую кладут значение. <code>let</code> создаёт коробку, содержимое которой можно менять, а <code>const</code> — запертый сундук (константу). Числа пишем просто так, а текст — обязательно в кавычках. Команда <code>console.log()</code> выводит содержимое в журнал.',
    code: 'let hero = "Алиса";\nlet gold = 5;\ngold = gold + 10;\nconsole.log(hero);\nconsole.log("Золота:", gold);',
    task: 'Добавь в код <b>новую</b> переменную (например, <code>const pet = "Дракон";</code> или измени количество золота) и выведи её через <code>console.log()</code>.',
    hint: 'const pet = "Огненный Дракон";\nlet gold = 100;\nconsole.log("Питомец:", pet);\nconsole.log("Золота:", gold);',
    check: function(r) {
      // Проверяем, что ученик изменил стартовый код или добавил свою переменную и вывел в консоль без ошибок
      var changed = r.code.trim() !== L[0].code.trim();
      return changed && /(let|const)\s+\w+/.test(r.code) && r.out.length > 0 && !r.err;
    }
  },
  {
    ico: '🌲',
    name: 'Лес Условий',
    story: 'Тропа раздваивается у древнего камня. Страж леса пускает дальше только тех, кто набрал хотя бы 10 уровня. Он проверяет условие!',
    learn: '<b>Условие</b> <code>if</code> выбирает путь. Если выражение в круглых скобках истинно (<code>true</code>) — выполняется первый блок в фигурных скобках <code>{ ... }</code>, иначе — запасной блок <code>else</code>. Знаки сравнения: <code>&gt;</code> (больше), <code>&lt;</code> (меньше), <code>&gt;=</code> (больше или равно), <code>===</code> (точно равно).',
    code: 'let age = 8;\nif (age >= 10) {\n  console.log("Проход открыт");\n} else {\n  console.log("Подрасти ещё!");\n}',

  else if (tabName === 'node') renderNodeModule();

  else if (tabName === 'test') startTest();
}

function esc(t) {
  return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function fmt(a) {
  if (typeof a === 'object' && a !== null) {
    try { return JSON.stringify(a); } catch (e) { return String(a); }
  }
  return String(a);
}

/* Построение HTML-дерева для уроков 6 и 7 */
function renderDomTreeHtml(node, depth) {
  var s = '';
  for (var c = node.firstChild; c; c = c.nextSibling) {
    var pad = '&nbsp;&nbsp;'.repeat(depth);
    if (c.nodeType === 1) {
      var attrs = '';
      for (var k = 0; k < c.attributes.length; k++) {
        var a = c.attributes[k];
        if (a.name !== 'style' && a.name !== 'class') {
          attrs += ' <span class="at">' + esc(a.name) + '="' + esc(a.value) + '"</span>';
        }
      }
      s += pad + '<span class="tg">&lt;' + c.tagName.toLowerCase() + '</span>' + attrs + '<span class="tg">&gt;</span><br>' + renderDomTreeHtml(c, depth + 1);
    } else if (c.nodeType === 3 && c.textContent.trim()) {
      s += pad + '<span class="tx">"' + esc(c.textContent.trim()) + '"</span><br>';
    }
  }
  return s;
}

/* Генерация интерактивной мини-визуализации для каждого урока */
function buildLessonVisualizer(idx, outLines, codeStr) {
  if (idx === 0) {
    // Визуальные коробки переменных
    var boxes = [];
    var reg = /(?:let|const)\s+(\w+)\s*=\s*([^;\n]+)/g;
    var m;
    while ((m = reg.exec(codeStr)) !== null) {
      boxes.push({ name: m[1], val: m[2].trim() });
    }
    if (!boxes.length) return '';
    var bHtml = boxes.map(function(b) {
      return '<div class="px-3.5 py-2 rounded-xl border-2 bg-amber-500/10 flex flex-col items-center min-w-[110px]" style="border-color:var(--gold)">' +
        '<span class="text-[11px] uppercase font-bold tracking-wider opacity-75">📦 ' + esc(b.name) + '</span>' +
        '<span class="font-mono font-bold text-sm mt-1">' + esc(b.val) + '</span>' +
      '</div>';
    }).join('');
    return '<div class="mt-3 p-3 rounded-xl bg-black/5 dark:bg-white/5">' +
      '<div class="text-xs font-bold mb-2">🔍 Коробки переменных в памяти компьютера:</div>' +
      '<div class="flex flex-wrap gap-2.5">' + bHtml + '</div>' +
    '</div>';
  }
  if (idx === 2) {
    // Визуализация шагов цикла
    var count = Math.min(15, outLines.length);
    var steps = '';
    for (var s = 1; s <= count; s++) {
      steps += '<span class="inline-flex items-center justify-center w-8 h-8 rounded-full font-bold text-xs bg-emerald-500 text-slate-950 shadow">👣' + s + '</span>';
    }
    return '<div class="mt-3 p-3 rounded-xl bg-black/5 dark:bg-white/5">' +
      '<div class="text-xs font-bold mb-2">⛰️ Пройденные шаги цикла (' + outLines.length + '):</div>' +
      '<div class="flex flex-wrap gap-1.5">' + (steps || '<span class="text-xs opacity-60">Нажми «Запустить», чтобы увидеть шаги</span>') + '</div>' +
    '</div>';
  }
  if (idx === 4) {
    // Визуализация ячеек массива с индексами [0], [1]...
    var items = outLines.filter(function(l) { return l.indexOf('Предмет:') === 0; }).map(function(l) { return l.replace('Предмет:', '').trim(); });
    if (!items.length) return '';
    var cells = items.map(function(it, idxNum) {
      return '<div class="px-3 py-2 rounded-xl border-2 bg-purple-500/10 text-center" style="border-color:var(--line)">' +
        '<div class="text-[10px] font-mono opacity-70">индекс [' + idxNum + ']</div>' +
        '<div class="font-bold text-sm mt-0.5">💎 ' + esc(it) + '</div>' +
      '</div>';
    }).join('');
    return '<div class="mt-3 p-3 rounded-xl bg-black/5 dark:bg-white/5">' +
      '<div class="text-xs font-bold mb-2">🧳 Ячейки сундука-массива (нумерация с нуля!):</div>' +
      '<div class="flex flex-wrap gap-2">' + cells + '</div>' +
    '</div>';
  }
  return '';
}

/* Выполнение кода урока с поддержкой ЖИВОГО console.log при кликах по сцене! */
function evaluateLessonCheck(code, outArr, errObj, stageEl) {
  var l = L[curLesson];
  var ok = false;
  try {
    ok = l.check({
      code: code,
      out: outArr,
      err: errObj,
      stage: stageEl || document.createElement('div')
    });
  } catch (e) {}

  var res = $('res');
  if (!res) return;

  if (ok) {
    if (!state.done[curLesson]) {
      state.done[curLesson] = 1;
      addCoins(10, 'Урок «' + l.name + '» пройден!');
      setMascot('Ура! 🎉 Ты блестяще справился с заданием локации <b>«' + l.name + '»</b> и заработал +10 золотых монет!');
    }
    res.innerHTML = '<span style="color:var(--acc)">✔ Отлично! Задание полностью выполнено!</span>';
  } else {
    if (curLesson === 6 && !errObj && /addEventListener/.test(code)) {
      var clicksLeft = Math.max(0, 3 - outArr.length);
      res.innerHTML = '<span class="text-amber-600 dark:text-amber-400">⚡ Код запущен! Теперь нажми на кнопку «Нажми меня» на Белой Сцене ещё ' + clicksLeft + ' раз(а)!</span>';
    } else {
      res.innerHTML = state.done[curLesson]
        ? '<span style="color:var(--acc)">✔ Урок уже зачтён (попробуй выполнить условие снова).</span>'
        : '<span style="color:var(--bad)">Пока условие задания не выполнено — прочитай подсказку или измени код!</span>';
    }
  }
}

function runLessonCode() {
  var l = L[curLesson];
  var code = $('code').value;
  lastRunOut = [];
  var err = null;
  var st = $('stage');
  var eh = $('error-helper');
  if (eh) eh.classList.add('hidden');

  if (st) {
    st.innerHTML = BASE_STAGE_HTML;
  }

  function updateConsoleView() {
    var outEl = $('out');
    if (outEl) {
      outEl.textContent = lastRunOut.join('\n') || '(пусто — добавь console.log)';
      outEl.scrollTop = outEl.scrollHeight;
    }
    var visEl = $('lesson-visualizer');
    if (visEl) {
      visEl.innerHTML = buildLessonVisualizer(curLesson, lastRunOut, code);
    }
    evaluateLessonCheck(code, lastRunOut, err, st);
  }

  // Живая консоль: работает и синхронно, и асинхронно при кликах на кнопку в уроке 7!
  var customConsole = {
    log: function() {
      var line = [].slice.call(arguments).map(fmt).join(' ');
      lastRunOut.push(line);
      updateConsoleView();
    }
  };

  // Полная безопасная песочница document для сцены
  var customDoc = {
    querySelector: function(s) { return st ? st.querySelector(s) : null; },
    querySelectorAll: function(s) { return st ? st.querySelectorAll(s) : []; },
    getElementById: function(id) { return st ? st.querySelector('#' + id) : null; },
    createElement: function(tag) { return document.createElement(tag); },
    body: st
  };

  try {
    var fn = new Function('console', 'document', 'stage', code);
    fn(customConsole, customDoc, st);
  } catch (e) {
    err = e;
    lastRunOut.push('⚠️ Ошибка: ' + e.message);
    if (eh) {
      eh.classList.remove('hidden');
      eh.innerHTML = '<div class="font-bold mb-1">🩺 Детский переводчик ошибок:</div>' +
        '<div>' + translateJsError(e) + '</div>';
    }
  }

  updateConsoleView();
}

  $('app').innerHTML = html;
  $('ws-code').value = window._savedWsCode || WORKSHOP_STARTER;
  runWorkshopCode(false);
}

function insertWorkshopStep(stepNum) {
  var ta = $('ws-code');
  if (!ta) return;
  if (stepNum === 3 || stepNum === 4) {
    ta.value = ta.value + '\n\n' + WORKSHOP_STEP_SOLUTIONS[stepNum];
  } else {
    ta.value = getFullWorkshopSolution();
  }
  window._savedWsCode = ta.value;
  toast('Код шага ' + stepNum + ' добавлен в редактор!');
  runWorkshopCode(true);
}

function fillFullWorkshopCode() {
  var ta = $('ws-code');
  if (!ta) return;
  ta.value = getFullWorkshopSolution();
  window._savedWsCode = ta.value;
  runWorkshopCode(true);
}

function resetWorkshopCode() {
  var ta = $('ws-code');
  if (!ta) return;
  ta.value = WORKSHOP_STARTER;
  window._savedWsCode = ta.value;
  runWorkshopCode(false);
}

function runWorkshopCode(runAutoTests) {
  var ta = $('ws-code');
  if (!ta) return;
  var code = ta.value;
  window._savedWsCode = code;

  var stage = $('ws-stage');
  stage.innerHTML = WORKSHOP_STAGE_TEMPLATE;
  var out = [];
  var errEl = $('ws-error');
  errEl.classList.add('hidden');

  var wsCon = {
    log: function() {
      out.push([].slice.call(arguments).map(fmt).join(' '));
      var outBox = $('ws-out');
      if (outBox) outBox.textContent = out.join('\n');
    }
  };

  var wsDoc = {
    querySelector: function(s) { return stage.querySelector(s); },
    querySelectorAll: function(s) { return stage.querySelectorAll(s); },
    getElementById: function(id) { return stage.querySelector('#' + id); },
    createElement: function(t) { return document.createElement(t); },
    body: stage
  };

  var execError = null;
  try {
    var fn = new Function('console', 'document', code);
    fn(wsCon, wsDoc);
  } catch (e) {
    execError = e;
    errEl.classList.remove('hidden');
    errEl.innerHTML = '<b>⚠️ Ошибка в коде:</b> ' + esc(e.message) + '<br>' + translateJsError(e);
  }

  if (!runAutoTests) return;

  // Автопроверка 4 шагов
  var results = { 1: false, 2: false, 3: false, 4: false };
  if (!execError) {
    // Шаг 1: найдены ключевые элементы
    results[1] = /#hero-name/.test(code) && /#hero-lvl/.test(code) && /#quest-list/.test(code);

    // Шаг 2: симулируем смену имени
    var nameInp = stage.querySelector('#input-name');
    var saveBtn = stage.querySelector('#save-hero-btn');
    var heroName = stage.querySelector('#hero-name');
    if (nameInp && saveBtn && heroName) {
      nameInp.value = 'Гэндальф';
      saveBtn.click();
      if (heroName.textContent.trim() === 'Гэндальф') results[2] = true;
    }

    // Шаг 3: симулируем 4 клика по кнопке прокачки уровня (до 5 уровня)
    var lvlBtn = stage.querySelector('#lvl-btn');
    var lvlSpan = stage.querySelector('#hero-lvl');
    var rankSpan = stage.querySelector('#hero-rank');
    if (lvlBtn && lvlSpan && rankSpan) {
      for (var c = 0; c < 4; c++) lvlBtn.click();
      if (Number(lvlSpan.textContent) >= 5 && rankSpan.textContent.indexOf('Рыцарь') > -1) {
        results[3] = true;
      }
    }

    // Шаг 4: симулируем клик по кнопке добавления предмета
    var addBtn = stage.querySelector('#add-item-btn');
    var listEl = stage.querySelector('#quest-list');
    if (addBtn && listEl) {
      var beforeCount = listEl.querySelectorAll('li').length;
      addBtn.click();
      var afterCount = listEl.querySelectorAll('li').length;
      if (afterCount > beforeCount) results[4] = true;
    }
  }

  var newlyCompleted = 0;
  for (var s = 1; s <= 4; s++) {
    if (results[s] && !state.workshopSteps[s]) {
      state.workshopSteps[s] = true;
      newlyCompleted++;
    }
    var b = $('ws-badge-' + s);
    if (b) b.textContent = state.workshopSteps[s] ? '✅' : '⏳';
  }

  if (newlyCompleted > 0) {
    addCoins(newlyCompleted * 10, 'Шаги Мастерской выполнены!');
  }

  var rep = $('ws-report');
  if (rep) {
    rep.innerHTML =
      '<div class="font-bold mb-1">📊 Результат проверки Мастерской:</div>' +
      '<div>' + (results[1] ? '✅' : '❌') + ' <b>Шаг 1:</b> Поиск элементов карточки</div>' +
      '<div>' + (results[2] ? '✅' : '❌') + ' <b>Шаг 2:</b> Обновление имени героя по кнопке</div>' +
      '<div>' + (results[3] ? '✅' : '❌') + ' <b>Шаг 3:</b> Прокачка до 5 уровня и звание «⚔️ Рыцарь Кода»</div>' +
      '<div>' + (results[4] ? '✅' : '❌') + ' <b>Шаг 4:</b> Добавление нового предмета <code>&lt;li&gt;</code> в рюкзак</div>';
  }
}

/* Функции интерактивного тренажёра боковой панели VS Code Source Control */
function renderVscSimUI() {
  var box = $('vsc-sim-container');
  if (!box) return;

  var totalChanges = vscSimState.changes.length + vscSimState.staged.length;

  var stagedListHtml = vscSimState.staged.length
    ? vscSimState.staged.map(function(f, idx) {
        return '<div class="flex items-center justify-between px-2.5 py-1.5 rounded bg-emerald-500/15 border border-emerald-500/30 text-xs font-mono">' +
          '<span class="text-emerald-300">📄 ' + esc(f) + ' <i class="text-[10px] opacity-70">(в коробке)</i></span>' +
          '<button class="px-2 py-0.5 rounded bg-zinc-700 hover:bg-zinc-600 text-white font-bold" title="Убрать из коробки" onclick="vscUnstageFile(' + idx + ')">−</button>' +
        '</div>';
      }).join('')
    : '<div class="text-xs text-zinc-500 italic px-2 py-1">Пока пусто — нажми «+» рядом с файлом ниже!</div>';

  var changesListHtml = vscSimState.changes.length
    ? vscSimState.changes.map(function(f, idx) {
        return '<div class="flex items-center justify-between px-2.5 py-1.5 rounded bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-mono">' +
          '<span class="text-amber-300">📄 ' + esc(f) + ' <b class="text-amber-400 ml-1">M</b></span>' +
          '<button class="px-2.5 py-0.5 rounded bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold" title="Положить в коробку (Stage)" onclick="vscStageFile(' + idx + ')">+ В коробку</button>' +
        '</div>';
      }).join('')
    : '<div class="text-xs text-zinc-500 italic px-2 py-1">Все изменённые файлы уже сложены или сохранены!</div>';

  var mainActionBtn = '';
  if (vscSimState.unpushedCommits > 0) {
    mainActionBtn = '<button class="w-full py-2 px-3 rounded-lg font-bold text-xs sm:text-sm bg-emerald-500 hover:bg-emerald-400 text-slate-950 transition shadow flex items-center justify-center gap-2" onclick="vscSyncChanges()">' +
      '🔄 Клик 3: Sync Changes (' + vscSimState.unpushedCommits + '↑ Отправить в GitHub)' +
    '</button>';
  } else {
    mainActionBtn = '<button class="w-full py-2 px-3 rounded-lg font-bold text-xs sm:text-sm bg-blue-600 hover:bg-blue-500 text-white transition shadow flex items-center justify-center gap-2" onclick="vscCommitStaged()">' +
      '✔ Клик 2: Commit (Запечатать сохранение)' +
    '</button>';
  }

  var historyHtml = vscSimState.history.length
    ? '<div class="mt-3 pt-2.5 border-t border-white/10 text-xs">' +
        '<div class="font-bold text-zinc-400 mb-1">☁️ Отправлено на GitHub:</div>' +
        vscSimState.history.map(function(h) {
          return '<div class="text-emerald-400 font-mono text-[11px]">✔ ' + esc(h) + '</div>';
        }).join('') +
      '</div>'
    : '';

  box.innerHTML =
    '<div class="flex items-center justify-between text-xs mb-2 text-zinc-400">' +
      '<span>👤 Аккаунт: <b class="text-emerald-400">ГеройКода (GitHub ✔)</b></span>' +
      '<span class="px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-300 font-bold">Изменений: ' + totalChanges + '</span>' +
    '</div>' +

    '<div class="mb-2.5">' +
      '<input id="vsc-msg-input" type="text" value="' + esc(vscSimState.commitMsg) + '" oninput="vscSimState.commitMsg=this.value" placeholder="Сообщение (что сделано в коде)..." class="w-full px-3 py-1.5 rounded-lg bg-zinc-900 border border-zinc-700 text-white text-xs outline-none focus:border-blue-500 mb-2" />' +
      mainActionBtn +
    '</div>' +

    '<div class="space-y-3 mt-3">' +
      '<div>' +
        '<div class="text-[11px] font-bold uppercase tracking-wider text-emerald-400 mb-1 flex justify-between">' +
          '<span>📦 Staged Changes (В коробке: ' + vscSimState.staged.length + ')</span>' +
        '</div>' +
        '<div class="space-y-1">' + stagedListHtml + '</div>' +
      '</div>' +

      '<div>' +
        '<div class="text-[11px] font-bold uppercase tracking-wider text-amber-400 mb-1 flex justify-between items-center">' +
          '<span>📝 Changes (Изменённые файлы: ' + vscSimState.changes.length + ')</span>' +
          (vscSimState.changes.length > 0 ? '<button class="text-[11px] text-amber-300 underline hover:text-amber-200" onclick="vscStageAll()">+ Добавить все</button>' : '') +
        '</div>' +
        '<div class="space-y-1">' + changesListHtml + '</div>' +
      '</div>' +
    '</div>' +
    historyHtml;
}

function vscStageFile(idx) {
  var file = vscSimState.changes.splice(idx, 1)[0];
  if (file) vscSimState.staged.push(file);
  renderVscSimUI();
}

function vscStageAll() {
  while (vscSimState.changes.length > 0) {
    vscSimState.staged.push(vscSimState.changes.shift());
  }
  renderVscSimUI();
}

function vscUnstageFile(idx) {
  var file = vscSimState.staged.splice(idx, 1)[0];
  if (file) vscSimState.changes.push(file);
  renderVscSimUI();
}

function vscCommitStaged() {
  if (vscSimState.staged.length === 0) {
    toast('Сначала нажми «+ В коробку» рядом с файлом!', true);
    return;
  }
  var msg = (vscSimState.commitMsg || '').trim();
  if (!msg) {
    toast('Напиши короткое сообщение в поле Message!', true);
    return;
  }
  vscSimState.staged = [];
  vscSimState.unpushedCommits += 1;
  toast('📦 Коробка запечатана (Commit)! Теперь нажми зелёную кнопку Sync Changes!');
  renderVscSimUI();
}

function vscSyncChanges() {
  vscSimState.unpushedCommits = 0;
  vscSimState.synced = true;
  vscSimState.history.push('«' + vscSimState.commitMsg + '» — доставлено в облако GitHub!');
  if (!state.gitSteps.vscSync) {
    state.gitSteps.vscSync = 1;
    addCoins(15, 'Ты освоил сохранение через VS Code в 3 клика!');
  } else {
    toast('☁️ Изменения синхронизированы с GitHub!');
  }
  if (vscSimState.changes.length === 0) {
    vscSimState.changes = ['level2.js'];
    vscSimState.commitMsg = 'Добавил второй уровень';
  }
  renderVscSimUI();
}

function resetVscSim() {
  vscSimState = {
    changes: ['index.html', 'script.js', 'style.css'],
    staged: [],
    commitMsg: 'Добавил огненного дракона',
    unpushedCommits: 0,
    synced: false,
    history: []
  };
  renderVscSimUI();
}

function submitGitInput() {
  var inp = $('git-cmd-input');
  if (!inp || !inp.value.trim()) return;
  runGitCommand(inp.value.trim());
  inp.value = '';
}

function resetGitSim() {
  gitSimState = {
    initialized: false,
    staged: false,
    commits: [],
    branch: 'master',
    remoteUrl: '',
    pushed: false,
    logs: ['Тренажёр сброшен. Начни с команды git init!']
  };
  updateGitSimView();
}

function runGitCommand(rawCmd) {
  var cmd = rawCmd.trim();
  gitSimState.logs.push('$ ' + cmd);

  if (cmd === 'git init') {
    gitSimState.initialized = true;
    state.gitSteps.init = 1;
    gitSimState.logs.push('✅ Пустой репозиторий Git инициализирован в папке ~/kingdom-project/.git/');
  } else if (cmd === 'git status') {
    state.gitSteps.status = 1;
    if (!gitSimState.initialized) {
      gitSimState.logs.push('⚠️ fatal: это ещё не репозиторий git. Сначала выполни: git init');
    } else if (gitSimState.pushed) {
      gitSimState.logs.push('На ветке ' + gitSimState.branch + '. Всё синхронизировано с облаком GitHub!');
    } else if (gitSimState.staged) {
      gitSimState.logs.push('Изменения подготовлены к коммиту (в корзине Staging):\n  новый файл: index.html\n  новый файл: script.js\nВыполни git commit -m "Описание"');
    } else {
      gitSimState.logs.push('Неотслеживаемые файлы в рабочей папке:\n  index.html, script.js\nИспользуй "git add .", чтобы подготовить их к сохранению.');
    }
  } else if (/^git add/.test(cmd)) {
    if (!gitSimState.initialized) {
      gitSimState.logs.push('⚠️ Сначала включи машину времени командой: git init');
    } else {
      gitSimState.staged = true;
      state.gitSteps.add = 1;
      gitSimState.logs.push('🛒 Файлы перенесены на Сцену (Staging Area)! Готовы к коммиту.');
    }
  } else if (/^git commit/.test(cmd)) {
    if (!gitSimState.staged) {
      gitSimState.logs.push('⚠️ На сцене нет файлов для сохранения! Сначала выполни: git add .');
    } else {
      var m = cmd.match(/-m\s+["']([^"']+)["']/);
      var msg = m ? m[1] : 'Точка сохранения';
      var hash = Math.random().toString(16).substring(2, 8);
      gitSimState.commits.push({ hash: hash, msg: msg });
      gitSimState.staged = false;
      state.gitSteps.commit = 1;
      gitSimState.logs.push('📦 [' + gitSimState.branch + ' ' + hash + '] ' + msg + '\n 2 files changed, 45 insertions(+)');
    }
  } else if (/^git log/.test(cmd)) {
    if (gitSimState.commits.length === 0) {
      gitSimState.logs.push('📜 Летопись пока пуста — сделай свой первый коммит!');
    } else {
      var logLines = gitSimState.commits.map(function(c) {
        return c.hash + ' (HEAD -> ' + gitSimState.branch + ') ' + c.msg;
      }).join('\n');
      gitSimState.logs.push('📜 Летопись коммитов:\n' + logLines);
    }
  } else if (/^git branch -M (\w+)/.test(cmd)) {
    var bMatch = cmd.match(/^git branch -M (\w+)/);
    gitSimState.branch = bMatch[1];
    state.gitSteps.branch = 1;
    gitSimState.logs.push('🌿 Главная ветка переименована в "' + gitSimState.branch + '".');
  } else if (/^git switch -c (\S+)/.test(cmd)) {
    var swMatch = cmd.match(/^git switch -c (\S+)/);
    gitSimState.branch = swMatch[1];
    gitSimState.logs.push('🌌 Создана новая параллельная ветка "' + gitSimState.branch + '" и выполнен переход в неё!');
  } else if (/^git switch (\S+)/.test(cmd)) {
    var sw2 = cmd.match(/^git switch (\S+)/);
    gitSimState.branch = sw2[1];
    gitSimState.logs.push('🔀 Переключились на ветку "' + gitSimState.branch + '".');
  } else if (/^git merge (\S+)/.test(cmd)) {
    var mg = cmd.match(/^git merge (\S+)/);
    gitSimState.logs.push('🤝 Ветка "' + mg[1] + '" успешно объединена с текущей веткой "' + gitSimState.branch + '"!');
  } else if (/^git clone\s+(\S+)/.test(cmd)) {
    var cl = cmd.match(/^git clone\s+(\S+)/);
    gitSimState.initialized = true;
    gitSimState.logs.push('📥 Клонирование из ' + cl[1] + '...\n✅ Проект успешно скачан на компьютер!');
  } else if (/^git pull/.test(cmd)) {
    gitSimState.logs.push('⬇️ Проверка обновлений на GitHub... Already up to date (у тебя самая свежая версия!).');
  } else if (/^git config/.test(cmd)) {
    gitSimState.logs.push('🪪 Настройка профиля Git успешно сохранена!');
  } else if (/^git remote add origin\s+(\S+)/.test(cmd)) {
    var rMatch = cmd.match(/^git remote add origin\s+(\S+)/);
    gitSimState.remoteUrl = rMatch[1];
    state.gitSteps.remote = 1;
    gitSimState.logs.push('🔗 Установлена связь с облачным замком GitHub: ' + gitSimState.remoteUrl);
  } else if (/^git push/.test(cmd)) {
    if (gitSimState.commits.length === 0) {
      gitSimState.logs.push('⚠️ Нет ни одного сохранения (commit)! Сначала сделай git add . и git commit.');
    } else {
      if (!gitSimState.remoteUrl) {
        gitSimState.remoteUrl = 'https://github.com/hero/kingdom.git';
      }
      gitSimState.pushed = true;
      if (!state.gitSteps.push) {
        state.gitSteps.push = 1;
        addCoins(15, 'Код успешно отправлен на GitHub!');
      }
      gitSimState.logs.push('🚀 Перечисление объектов: 100%... Готово!\n☁️ Все коммиты успешно доставлены в GitHub (' + gitSimState.remoteUrl + ')!');
    }
  } else {
    gitSimState.logs.push('🤔 Команда не распознана тренажёром. Попробуй: git init, git status, git add ., git commit -m "Сейв", git log --oneline, git push');
  }

  saveState();
  updateGitSimView();
}

function requestNodeRoute(path) {
  var code = $('node-code') ? $('node-code').value : DEFAULT_NODE_SERVER_CODE;
  var urlEl = $('node-browser-url');
  var bodyEl = $('node-browser-body');
  if (urlEl) urlEl.textContent = 'http://localhost:3000' + path;

  // Мини-симулятор Express для разбора пользовательских маршрутов app.get(...)
  var routes = {};
  var err = null;
  try {
    var fakeApp = {
      get: function(routePath, handler) {
        routes[routePath] = handler;
      },
      listen: function(port, cb) {
        if (cb) cb();
      }
    };
    var fakeRequire = function() {
      return function() { return fakeApp; };
    };
    var fakeConsole = { log: function() {} };
    var fn = new Function('require', 'console', code);
    fn(fakeRequire, fakeConsole);
  } catch (e) {
    err = e;
  }

  if (err) {
    bodyEl.innerHTML = '<span class="text-red-600 font-bold">⚠️ Ошибка в коде server.js:\n' + esc(err.message) + '</span>';
    return;
  }

  var handler = routes[path];
  if (!handler) {
    nodeServerLogs.push('[Express] GET ' + path + ' -> 404 Not Found');
    bodyEl.innerHTML = '<span class="text-red-600">404 Cannot GET ' + esc(path) + '</span>';
  } else {
    var responsePayload = '';
    var isJson = false;
    var fakeRes = {
      send: function(val) { responsePayload = typeof val === 'object' ? JSON.stringify(val, null, 2) : String(val); },
      json: function(val) { isJson = true; responsePayload = JSON.stringify(val, null, 2); }
    };
    try {
      handler({ path: path }, fakeRes);
      nodeServerLogs.push('[Express] GET ' + path + ' -> 200 OK (' + (isJson ? 'application/json' : 'text/html') + ')');
      if (!state.nodeStarted && path !== '/') {
        state.nodeStarted = true;
        addCoins(15, 'Сервер Node.js протестирован!');
      }
      if (isJson) {
        bodyEl.innerHTML = '<div class="text-xs text-emerald-700 font-bold mb-1">// JSON-ответ от сервера:</div><pre class="text-xs bg-slate-900 text-amber-200 p-3 rounded-lg overflow-x-auto">' + esc(responsePayload) + '</pre>';
      } else {
        bodyEl.innerHTML = '<div class="text-base font-sans font-bold text-slate-800 p-2">' + esc(responsePayload) + '</div>';
      }
    } catch (e2) {
      bodyEl.innerHTML = '<span class="text-red-600">500 Ошибка внутри обработчика маршрута: ' + esc(e2.message) + '</span>';
    }
  }

  var term = $('node-term-out');
  if (term) {
    term.textContent = nodeServerLogs.slice(-6).join('\n');
    term.scrollTop = term.scrollHeight;
  }
}

function setupFigDropzone() {
  var dz = $('fig-dropzone');
  if (!dz) return;
  dz.addEventListener('dragover', function(e) {
    e.preventDefault();
    dz.style.borderColor = 'var(--gold)';
  });
  dz.addEventListener('dragleave', function() {
    dz.style.borderColor = 'var(--line)';
  });
  dz.addEventListener('drop', function(e) {
    e.preventDefault();
    dz.style.borderColor = 'var(--line)';
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) {
      parseUploadedFigFile(e.dataTransfer.files[0]);
    }
  });
}

function handleFigFileSelect(e) {
  if (e.target.files && e.target.files[0]) {
    parseUploadedFigFile(e.target.files[0]);
  }
}

/* Генерация и скачивание настоящего тестового файла KingdomCard.fig (с заголовком fig-kiwi и метаданными) */
function downloadSampleFigFile() {
  var samplePayload =
    'fig-kiwi\x00\x00\x00\x0F' +
    JSON.stringify({
      file_name: 'KingdomCard_Demo.fig',
      version: '2.0',
      frames: ['HeroCard_Container', 'Rank_Pill', 'Hero_Title', 'Quest_Description', 'Primary_Action'],
      colors: ['#1E1B2E', '#F5B041', '#F4EEFF', '#A89EC4', '#34D399'],
      fonts: ['Comfortaa', 'Inter']
    });
  var blob = new Blob([samplePayload], { type: 'application/octet-stream' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'KingdomCard.fig';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function() { URL.revokeObjectURL(url); }, 2000);
  toast('📥 Файл KingdomCard.fig скачан! Теперь перетащи его в пунктирную зону выше.');
}

/* Клиентский анализатор реального .fig файла (поддерживает ZIP-контейнеры Figma и бинарные fig-kiwi файлы) */
function parseUploadedFigFile(file) {
  var reader = new FileReader();
  reader.onload = function(evt) {
    var buffer = evt.target.result;
    var bytes = new Uint8Array(buffer);
    var sizeKB = (file.size / 1024).toFixed(1);

    // Проверяем сигнатуру файла: PK\x03\x04 (ZIP-контейнер Figma) или fig-kiwi / fig-jam
    var headerAscii = '';
    for (var i = 0; i < Math.min(12, bytes.length); i++) {
      if (bytes[i] >= 32 && bytes[i] <= 126) headerAscii += String.fromCharCode(bytes[i]);
    }

    var isZip = bytes[0] === 0x50 && bytes[1] === 0x4B;
    var isKiwi = headerAscii.indexOf('fig-') === 0;

    // Извлекаем читаемые ASCII/UTF-8 строки, названия слоёв, шрифты и HEX-цвета из файла
    var decoder = new TextDecoder('utf-8', { fatal: false });
    var rawText = decoder.decode(bytes.subarray(0, Math.min(bytes.length, 250000)));

    var zipEntries = [];
    if (isZip) {
      // Ищем имена файлов внутри ZIP-контейнера .fig (canvas.fig, meta.json, thumbnail.png, images/...)
      var view = new DataView(buffer);
      var offset = 0;
      while (offset + 30 < bytes.length) {
        if (view.getUint32(offset, true) === 0x04034b50) {
          var nameLen = view.getUint16(offset + 26, true);
          var extraLen = view.getUint16(offset + 28, true);
          var compSize = view.getUint32(offset + 18, true);
          var entryName = decoder.decode(bytes.subarray(offset + 30, offset + 30 + nameLen));
          zipEntries.push(entryName);
          offset += 30 + nameLen + extraLen + compSize;
        } else {
          offset++;
        }
        if (zipEntries.length > 25) break;
      }
    }

    var hexMatches = rawText.match(/#[0-9A-Fa-f]{6}\b/g) || ['#1E1B2E', '#F5B041', '#34D399', '#F24E1E'];
    var uniqueColors = [];
    hexMatches.forEach(function(c) {
      var up = c.toUpperCase();
      if (uniqueColors.indexOf(up) === -1 && uniqueColors.length < 8) uniqueColors.push(up);
    });

    customFigReport = {
      name: file.name,
      sizeKB: sizeKB,
      format: isZip ? 'Figma ZIP Container (PK archive)' : (isKiwi ? 'Figma Binary Stream (fig-kiwi)' : 'Figma File (' + (headerAscii || 'binary') + ')'),
      entries: zipEntries.length ? zipEntries : ['canvas.fig', 'meta.json', 'thumbnail.png'],
      colors: uniqueColors
    };

    if (!state.figmaInspected) {
      state.figmaInspected = true;
      addCoins(15, 'Файл .fig успешно открыт и исследован в браузере!');
    } else {
      toast('✅ Файл ' + file.name + ' успешно прочитан!');
    }

    renderCustomFigBanner();
  };
  reader.readAsArrayBuffer(file);
}

  var b = $('fig-parsed-banner');
  if (!b || !customFigReport) return;
  b.classList.remove('hidden');
  var colorBadges = customFigReport.colors.map(function(c) {
    return '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded bg-black/10 dark:bg-white/10 font-mono text-[11px] cursor-pointer" onclick="copyText(\'' + c + '\', \'цвет ' + c + '\')">' +
      '<i class="inline-block w-3 h-3 rounded-full border border-white/40" style="background:' + c + '"></i>' + c +
    '</span>';
  }).join(' ');

  b.innerHTML =
    '<div class="font-bold text-sm mb-1">✅ Файл <code>' + esc(customFigReport.name) + '</code> (' + customFigReport.sizeKB + ' КБ) открыт в браузерном инспекторе!</div>' +
    '<div class="grid grid-cols-1 md:grid-cols-3 gap-2 mt-2">' +
      '<div><b>Формат контейнера:</b> ' + esc(customFigReport.format) + '</div>' +
      '<div><b>Внутренние разделы .fig:</b> <code>' + esc(customFigReport.entries.join(', ')) + '</code></div>' +
      '<div><b>Найденная палитра:</b> ' + colorBadges + '</div>' +
    '</div>';
}

    if (DEMO_FIG_LAYERS[i].id === layerId) {
      selectedFigLayer = DEMO_FIG_LAYERS[i];
      break;
    }
  }
  if (!state.figmaInspected) {
    state.figmaInspected = true;
    addCoins(10, 'Макет Figma исследован в инспекторе!');
  }
  updateFigmaInspectorUI();
}

var qi = 0;
var sc = 0;

function startTest() {
  qi = 0;
  sc = 0;
  updateHeaderStats();
  setMascot('Ты вошёл в <b>Храм Испытаний</b>! Ответь на 10 вопросов по JavaScript, DOM, Git и Node.js, чтобы получить рыцарское или магическое звание!');
  renderQuestion();
}

function renderQuestion() {
  if (qi >= Q.length) {
    var prevBest = state.best;
    if (sc > state.best) state.best = sc;
    var rank = sc >= 9 ? '🧙 Великий Архимаг Fullstack и JS'
             : sc >= 7 ? '🛡️ Рыцарь Королевства Кода'
             : sc >= 5 ? '🗡️ Отважный Оруженосец'
             : '🌱 Юный Путешественник';

    if (sc >= 7 && prevBest < 7) {
      addCoins(30, 'Храм Испытаний покорён!');
    } else {
      saveState();
    }

    $('app').innerHTML =
      '<div class="k-card text-center py-8">' +
        '<div class="text-6xl mb-3">🏆</div>' +
        '<h2 class="text-2xl font-bold mb-2">Твой результат: ' + sc + ' из ' + Q.length + '</h2>' +
        '<p class="text-lg mb-2">Присвоено звание: <b class="text-amber-600 dark:text-amber-400">' + rank + '</b></p>' +
        '<p class="text-sm mb-6" style="color:var(--mute)">' +
          (sc >= 7 ? 'Королевство гордится тобой! Все дороги разработки открыты перед тобой!' : 'Хорошая попытка! Загляни на Карту уроков и попробуй пройти испытание ещё раз.') +
        '</p>' +
        '<div class="flex justify-center gap-3">' +
          '<button class="k-btn" onclick="startTest()">🔄 Пройти ещё раз</button>' +
          '<button class="k-btn ghost" onclick="switchTab(\'map\')">🗺️ На карту королевства</button>' +
        '</div>' +
      '</div>';
    return;
  }

  var q = Q[qi];
  var pct = Math.round((qi / Q.length) * 100);
  var html =
    '<div class="k-card max-w-2xl mx-auto">' +
      '<div class="flex items-center justify-between text-xs font-bold mb-2" style="color:var(--mute)">' +
        '<span>🏆 Храм Испытаний · Вопрос ' + (qi + 1) + ' из ' + Q.length + '</span>' +
        '<span>Рекорд: ' + state.best + '/' + Q.length + '</span>' +
      '</div>' +
      '<div class="w-full h-2.5 bg-black/10 dark:bg-white/10 rounded-full overflow-hidden mb-4">' +
        '<div class="h-full bg-emerald-500 transition-all duration-300" style="width:' + pct + '%"></div>' +
      '</div>' +
      '<h3 class="text-lg sm:text-xl font-bold mb-4">' + esc(q.q) + '</h3>' +
      '<div class="space-y-2.5">' +
        q.o.map(function(optText, k) {
          return '<button class="opt-btn w-full text-left p-3.5 rounded-xl border-2 font-medium transition hover:border-amber-500" style="border-color:var(--line)" onclick="pickAnswer(' + k + ', this)">' + esc(optText) + '</button>';
        }).join('') +
      '</div>' +
      '<div id="quiz-fb" class="mt-4"></div>' +
    '</div>';

  $('app').innerHTML = html;
}

function pickAnswer(k, btnEl) {
  var q = Q[qi];
  var buttons = document.querySelectorAll('.opt-btn');
  buttons.forEach(function(b, j) {
    b.disabled = true;
    if (j === q.a) {
      b.style.borderColor = 'var(--acc)';
      b.style.background = 'var(--acc-light)';
    }
  });
  if (k === q.a) {
    sc++;
  } else {
    btnEl.style.borderColor = 'var(--bad)';
    btnEl.style.background = 'var(--bad-light)';
  }

  $('quiz-fb').innerHTML =
    '<div class="p-3.5 rounded-xl border text-sm mb-3" style="border-color:var(--line)">' +
      (k === q.a ? '<b style="color:var(--acc)">✔ Верно!</b> ' : '<b style="color:var(--bad)">✖ Не совсем так.</b> ') +
      esc(q.e) +
    '</div>' +
    '<button class="k-btn" onclick="qi++; renderQuestion()">Дальше →</button>';
}

/* Старт приложения */
window.onload = function() {
  loadState();
  renderMap();
};
</script>
</body>
</html>
