<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Королевство JavaScript</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3e6c4;--card:#fff8e3;--ink:#3b2a14;--mute:#7a6444;--gold:#c9871a;--acc:#2f7d4f;--bad:#b3392f;--code:#2a2233;--codeink:#f5e9ff;--line:#d9c392}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1d1a2b;--card:#2a2640;--ink:#f1e8d0;--mute:#b6a98a;--gold:#f0b44a;--acc:#5fc58a;--bad:#ff7b6e;--code:#14111f;--codeink:#f5e9ff;--line:#4a4468}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1d1a2b;--card:#2a2640;--ink:#f1e8d0;--mute:#b6a98a;--gold:#f0b44a;--acc:#5fc58a;--bad:#ff7b6e;--code:#14111f;--codeink:#f5e9ff;--line:#4a4468}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.5}
main{max-width:980px;margin:0 auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:1.6rem}
.stats{font-weight:bold;color:var(--gold)}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.loc{cursor:pointer;text-align:center;transition:transform .15s;margin:0}
.loc:hover{transform:translateY(-3px)}
.loc .i{font-size:2.4rem}
.loc.done{border-color:var(--acc)}
button{font:inherit;cursor:pointer;border:2px solid var(--gold);background:var(--gold);color:#2b1c05;border-radius:10px;padding:7px 14px;font-weight:bold}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button:disabled{opacity:.5}
textarea{width:100%;min-height:170px;background:var(--code);color:var(--codeink);border:2px solid var(--line);border-radius:10px;padding:10px;font:14px/1.5 ui-monospace,Consolas,monospace;resize:vertical}
pre.out{background:var(--code);color:#9ff0b8;border-radius:10px;padding:10px;min-height:48px;margin:8px 0;font:14px ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-x:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:720px){.grid2{grid-template-columns:1fr}}
.stage{background:#fff;color:#222;border:2px dashed var(--line);border-radius:10px;padding:12px;min-height:110px}
.tree{background:var(--code);color:var(--codeink);border-radius:10px;padding:10px;font:13px/1.6 ui-monospace,Consolas,monospace;overflow-x:auto;min-height:110px}
.tg{color:#ffb86b}.at{color:#8be9fd}.tx{color:#c3b8d6}
.task{border-left:5px solid var(--gold);padding:6px 12px;background:rgba(201,135,26,.12);border-radius:6px}
.ok{color:var(--acc);font-weight:bold}.no{color:var(--bad);font-weight:bold}
.opt{display:block;width:100%;text-align:left;margin:6px 0;background:transparent;color:var(--ink);border-color:var(--line)}
.opt.r{border-color:var(--acc);background:rgba(47,125,79,.2)}.opt.w{border-color:var(--bad);background:rgba(179,57,47,.2)}
.bar{height:10px;background:var(--line);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
code{background:rgba(120,100,60,.2);padding:1px 5px;border-radius:4px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--acc);color:#fff;padding:10px 18px;border-radius:20px;display:none;z-index:5;font-weight:bold}
</style>
</head>
<body>
<main>
<header><h1>🏰 Королевство JavaScript</h1><div class="stats" id="stats"></div></header>
<div id="app"></div>
</main>
<div id="toast"></div>
<script>
var BASE='<h2>Привет, мир!</h2><p class="txt">Я живу в DOM</p><button id="btn">Нажми меня</button>';
var L=[
{ico:'🌾',name:'Долина Переменных',
 story:'Ты — юный путешественник и ступил на землю JavaScript. Первый житель, Гном-Кладовщик, протягивает тебе коробки с ярлыками.',
 learn:'<b>Переменная</b> — это коробка с названием, куда кладут значение. <code>let</code> создаёт коробку, которую можно менять, <code>const</code> — запертую. Числа пишем как есть, текст — в кавычках. <code>console.log()</code> показывает значение в журнале.',
 code:'let hero = "Алиса";\nlet gold = 5;\ngold = gold + 10;\nconsole.log(hero);\nconsole.log("Золота:", gold);',
 task:'Создай свою переменную с помощью let или const и выведи её через console.log.',
 hint:'Например: const pet = "дракон"; console.log(pet);',
 check:function(r){return /(let|const)\s+\w+/.test(r.code)&&r.out.length>0&&!r.err}},
{ico:'🌲',name:'Лес Условий',
 story:'Тропа раздваивается. Страж леса пускает только тех, кто достаточно взрослый. Он проверяет условие!',
 learn:'<b>Условие</b> <code>if</code> выбирает путь. Если выражение в скобках истинно — выполняется первый блок, иначе — блок <code>else</code>. Сравнения: <code>&gt;</code> <code>&lt;</code> <code>&gt;=</code> <code>===</code>.',
 code:'let age = 8;\nif (age >= 10) {\n  console.log("Проход открыт");\n} else {\n  console.log("Подрасти ещё!");\n}',
 task:'Измени код так, чтобы Страж сказал «Проход открыт».',
 hint:'Поменяй значение age на 10 или больше.',
 check:function(r){return r.out.join(' ').indexOf('Проход открыт')>-1}},
{ico:'⛰️',name:'Горы Циклов',
 story:'Чтобы подняться на гору, нужно сделать много шагов. Писать «шаг» сто раз лень — на помощь приходит цикл!',
 learn:'<b>Цикл</b> <code>for</code> повторяет код. В скобках три части: старт (<code>let i = 1</code>), условие продолжения (<code>i &lt;= 3</code>) и шаг (<code>i++</code> — прибавить 1).',
 code:'for (let i = 1; i <= 3; i++) {\n  console.log("Шаг номер " + i);\n}',
 task:'Заставь путешественника сделать 7 шагов или больше.',
 hint:'Замени 3 на 7 в условии цикла.',
 check:function(r){return r.out.length>=7}},
{ico:'🏯',name:'Замок Функций',
 story:'В замке живёт Волшебник. Он умеет «заклинания» — наборы действий, которые можно вызывать по имени.',
 learn:'<b>Функция</b> — заклинание с именем. Объявляем: <code>function имя(параметр) { ... }</code>. Вызываем: <code>имя("значение")</code>. <code>return</code> возвращает результат.',
 code:'function greet(name) {\n  return "Привет, " + name + "!";\n}\nconsole.log(greet("Волшебник"));\nconsole.log(greet("Принцесса"));',
 task:'Напиши свою функцию (например, double(n), которая удваивает число) и вызови её.',
 hint:'function double(n) { return n * 2; } console.log(double(21));',
 check:function(r){return /function\s+\w+|=>/.test(r.code)&&r.out.length>0&&!r.err&&/\w+\(/.test(r.code.split('}').pop()+r.code)}},
{ico:'🕳️',name:'Пещера Массивов',
 story:'В пещере лежит сундук с отделениями, пронумерованными с нуля. Это массив — список сокровищ.',
 learn:'<b>Массив</b> — список в квадратных скобках: <code>["меч","щит"]</code>. Номера (индексы) начинаются с <b>0</b>. <code>.push(x)</code> добавляет в конец, <code>.length</code> — длина, а <code>for...of</code> обходит все элементы.',
 code:'let bag = ["меч", "щит"];\nbag.push("зелье");\nconsole.log(bag[0]);\nconsole.log("В сумке:", bag.length);\nfor (let item of bag) {\n  console.log("Предмет: " + item);\n}',
 task:'Добавь в сумку ещё два предмета через push и выведи длину.',
 hint:'bag.push("карта"); bag.push("ключ");',
 check:function(r){return (r.code.match(/\.push\(/g)||[]).length>=3&&r.out.length>0&&!r.err}},
{ico:'🗼',name:'Башня DOM',dom:1,
 story:'На вершине башни — Дерево Страницы. Каждая часть сайта — ветка! Справа ты видишь живое DOM-дерево сцены. Меняй код и смотри, как оно растёт.',
 learn:'<b>DOM</b> — дерево из элементов страницы. <code>document.querySelector("h2")</code> находит элемент, <code>.textContent</code> меняет текст, <code>.style.color</code> — цвет. <code>document.createElement("p")</code> создаёт новую ветку, а <code>appendChild</code> прикрепляет её.',
 code:'let title = document.querySelector("h2");\ntitle.textContent = "Я хозяин башни!";\ntitle.style.color = "purple";\n\nlet p = document.createElement("p");\np.textContent = "Новая ветка!";\ndocument.body.appendChild(p);',
 task:'Измени текст заголовка h2 на любой свой.',
 hint:'title.textContent = "Мой текст";',
 check:function(r){var h=r.stage.querySelector('h2');return !r.err&&(!h||h.textContent!=='Привет, мир!')}},
{ico:'⚡',name:'Остров Событий',dom:1,
 story:'На острове всё оживает, когда ты что-то делаешь: нажимаешь, наводишь мышь. Это события! Попробуй нажать на кнопку на сцене.',
 learn:'<b>Событие</b> — действие пользователя. <code>кнопка.addEventListener("click", функция)</code> говорит: «когда нажмут — выполни это». Сначала нажми «Запустить», потом жми кнопку на сцене.',
 code:'let btn = document.querySelector("#btn");\nlet count = 0;\nbtn.addEventListener("click", function () {\n  count++;\n  btn.textContent = "Нажато " + count + " раз";\n  console.log("Бум! " + count);\n});',
 task:'Запусти код и нажми кнопку на сцене 3 раза. Потом поменяй текст на свой!',
 hint:'Кнопка оживает только после запуска кода.',
 check:function(r){return /addEventListener\(\s*["']click/.test(r.code)&&!r.err}}
];
var Q=[
{q:'Как создать переменную, которую можно менять?',o:['let x = 5;','fix x = 5;','x := 5;'],a:0,e:'let создаёт изменяемую коробку.'},
{q:'Что покажет console.log(2 + 3)?',o:['23','5','"2+3"'],a:1,e:'Числа складываются: 5.'},
{q:'Какой блок выполнится, если условие ложно?',o:['if','else','for'],a:1,e:'else — запасной путь.'},
{q:'Сколько раз сработает: for (let i = 0; i < 4; i++)?',o:['3','4','5'],a:1,e:'i равно 0, 1, 2, 3 — всего 4 раза.'},
{q:'С какого номера начинаются индексы массива?',o:['0','1','-1'],a:0,e:'Первый элемент — bag[0].'},
{q:'Что делает arr.push("x")?',o:['Удаляет элемент','Добавляет в конец','Сортирует массив'],a:1,e:'push — положить в конец.'},
{q:'Как вызвать функцию greet?',o:['greet','greet()','call greet'],a:1,e:'Скобки запускают функцию.'},
{q:'Что делает document.querySelector("h2")?',o:['Находит элемент на странице','Рисует заголовок','Удаляет страницу'],a:0,e:'Находит первую ветку h2 в DOM.'},
{q:'Как сказать: «когда нажмут кнопку — сделай это»?',o:['btn.onWait()','btn.addEventListener("click", ...)','btn.if(click)'],a:1,e:'addEventListener слушает события.'},
{q:'Как изменить текст элемента el?',o:['el.textContent = "Привет"','el.text("Привет")','el = "Привет"'],a:0,e:'textContent — текст внутри элемента.'}
];
var done={},coins=0,app=document.getElementById('app'),best=0;
function $(i){return document.getElementById(i)}
function toast(t){var e=$('toast');e.textContent=t;e.style.display='block';setTimeout(function(){e.style.display='none'},1800)}
function stats(){var n=Object.keys(done).length;$('stats').textContent='⭐ '+n+'/'+L.length+'  🪙 '+coins}
function map(){
 stats();var h='<div class="card"><b>Карта королевства.</b> Пройди все 7 земель, выполняя задания, а затем иди в Храм Испытаний, чтобы получить звание.</div><div class="map">';
 L.forEach(function(l,i){h+='<div class="card loc'+(done[i]?' done':'')+'" onclick="lesson('+i+')"><div class="i">'+l.ico+'</div><b>'+(i+1)+'. '+l.name+'</b><div>'+(done[i]?'<span class="ok">✔ пройдено</span>':'<span style="color:var(--mute)">в путь</span>')+'</div></div>'});
 h+='<div class="card loc" onclick="test()"><div class="i">🏆</div><b>Храм Испытаний</b><div style="color:var(--mute)">итоговый тест'+(best?' · рекорд '+best+'/'+Q.length:'')+'</div></div></div>';
 app.innerHTML=h}
function fmt(a){return typeof a==='object'&&a!==null?JSON.stringify(a):String(a)}
function tree(n,d){var s='';for(var c=n.firstChild;c;c=c.nextSibling){var p='&nbsp;&nbsp;'.repeat(d);
 if(c.nodeType===1){var at='';for(var k=0;k<c.attributes.length;k++){var a=c.attributes[k];if(a.name!=='style')at+=' <span class="at">'+a.name+'="'+esc(a.value)+'"</span>'}
  s+=p+'<span class="tg">&lt;'+c.tagName.toLowerCase()+'</span>'+at+'<span class="tg">&gt;</span><br>'+tree(c,d+1)}
 else if(c.nodeType===3&&c.textContent.trim())s+=p+'<span class="tx">"'+esc(c.textContent.trim())+'"</span><br>'}return s}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
var cur=0,mo=null;
function lesson(i){cur=i;var l=L[i];stats();
 app.innerHTML='<button class="ghost" onclick="map()">← На карту</button><div class="card"><h2 style="margin:0 0 6px">'+l.ico+' '+l.name+'</h2><p><i>'+l.story+'</i></p><p>📖 '+l.learn+'</p></div>'+
 '<div class="card"><textarea id="code" spellcheck="false"></textarea><div style="margin:8px 0"><button onclick="run()">▶ Запустить</button> <button class="ghost" onclick="reset()">↺ Сбросить код</button></div>'+
 '<div>📜 Журнал:</div><pre class="out" id="out"></pre>'+
 (l.dom?'<div class="grid2"><div><div>🎭 Сцена:</div><div class="stage" id="stage"></div></div><div><div>🌳 DOM-дерево (живое):</div><div class="tree" id="tree"></div></div></div>':'')+
 '</div><div class="card task">🎯 <b>Задание:</b> '+l.task+' <button class="ghost" onclick="alert(L[cur].hint)">💡 Подсказка</button><div id="res" style="margin-top:6px">'+(done[i]?'<span class="ok">✔ Задание выполнено!</span>':'')+'</div></div>'+
 (i<L.length-1?'<button onclick="lesson('+(i+1)+')">Дальше: '+L[i+1].name+' →</button>':'<button onclick="test()">В Храм Испытаний 🏆</button>');
 $('code').value=l.code;
 if(mo)mo.disconnect();
 if(l.dom){var st=$('stage');st.innerHTML=BASE;mo=new MutationObserver(function(){$('tree').innerHTML=tree(st,0)});mo.observe(st,{childList:true,subtree:true,attributes:true,characterData:true});$('tree').innerHTML=tree(st,0)}}
function reset(){$('code').value=L[cur].code}
function run(){var l=L[cur],code=$('code').value,out=[],err=null,st=$('stage');
 var con={log:function(){out.push([].slice.call(arguments).map(fmt).join(' '))}};
 if(st){st.innerHTML=BASE}
 var doc={querySelector:function(s){return st?st.querySelector(s):null},querySelectorAll:function(s){return st?st.querySelectorAll(s):[]},createElement:function(t){return document.createElement(t)},body:st};
 try{new Function('console','document','stage',code)(con,doc,st)}catch(e){err=e;out.push('⚠️ Ошибка: '+e.message)}
 $('out').textContent=out.join('\n')||'(пусто — добавь console.log)';
 var ok=false;try{ok=l.check({code:code,out:out,err:err,stage:st||document.createElement('div')})}catch(e){}
 var res=$('res');
 if(ok){if(!done[cur]){done[cur]=1;coins+=10;stats();toast('+10 🪙 Задание выполнено!')}res.innerHTML='<span class="ok">✔ Задание выполнено!</span>'}
 else res.innerHTML=done[cur]?'<span class="ok">✔ Задание выполнено!</span>':'<span class="no">Пока не получилось — попробуй ещё!</span>'}
var qi=0,sc=0;
function test(){if(mo)mo.disconnect();qi=0;sc=0;stats();ask()}
function ask(){
 if(qi>=Q.length){if(sc>best)best=sc;var r=sc>=9?'🧙 Великий Маг JavaScript':sc>=7?'🛡️ Рыцарь Кода':sc>=5?'🗡️ Оруженосец':'🌱 Юный Путешественник';
  if(sc>=7){coins+=30;stats()}
  app.innerHTML='<div class="card" style="text-align:center"><div style="font-size:3rem">🏆</div><h2>Твой результат: '+sc+'/'+Q.length+'</h2><p>Звание: <b>'+r+'</b></p><p>'+(sc>=7?'Королевство гордится тобой! +30 🪙':'Перечитай уроки на карте и попробуй снова!')+'</p><button onclick="test()">Пройти ещё раз</button> <button class="ghost" onclick="map()">На карту</button></div>';return}
 var q=Q[qi],h='<button class="ghost" onclick="map()">← На карту</button><div class="card"><div class="bar"><i style="width:'+(qi/Q.length*100)+'%"></i></div><p>Вопрос '+(qi+1)+' из '+Q.length+'</p><h3>'+esc(q.q)+'</h3>';
 q.o.forEach(function(o,k){h+='<button class="opt" onclick="pick('+k+',this)">'+esc(o)+'</button>'});
 app.innerHTML=h+'<div id="fb"></div></div>'}
function pick(k,b){var q=Q[qi],bs=document.querySelectorAll('.opt');
 bs.forEach(function(x,j){x.disabled=true;if(j===q.a)x.classList.add('r')});
 if(k===q.a)sc++;else b.classList.add('w');
 $('fb').innerHTML='<p>'+(k===q.a?'<span class="ok">Верно!</span> ':'<span class="no">Не совсем.</span> ')+esc(q.e)+'</p><button onclick="qi++;ask()">Дальше →</button>'}
map();
</script>
</body>
</html>
